[package]
name = "rcrash"
version = "0.1.0"
edition = "2021"
authors = ["l898974766 <l898974766@outlook.com>"]
license = "MIT"

[dependencies]
anyhow = "1.0.81"
bytes = "1.6.0"
dashmap = "6.1.0"
enum_dispatch = "0.3.13"
futures = { version = "0.3.30", default-features = false }
lazy_static = "1.4.0"
thiserror = "2.0.12"
tokio = { version = "1.37.0", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
] }
tokio-stream = "0.1.15"
tokio-util = { version = "0.7.10", features = ["codec"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
winnow = { version = "0.7.12", features = ["simd"] }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[profile.release]
opt-level = 3     # 最强的优化级别
lto = true        # 启用链接时优化（LTO）
panic = "abort"   # 设置 panic 处理策略（避免额外的栈展开开销）
codegen-units = 1 # 限制代码生成单元数量
