[package]
name = "rcrash"
version = "0.1.0"
edition = "2021"
authors = ["l898974766 <l898974766@outlook.com>"]
license = "MIT"

[dependencies]
anyhow = "1.0.98"
deno_core = { version = "0.352.0" }
deno_console = "0.210.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_v8 = { version = "0.261.0" }
tokio = { version = "1.46.1", features = ["rt"] }

[workspace]

[profile.release]
opt-level = 3     # 最强的优化级别
lto = true        # 启用链接时优化（LTO）
panic = "abort"   # 设置 panic 处理策略（避免额外的栈展开开销）
codegen-units = 1 # 限制代码生成单元数量
